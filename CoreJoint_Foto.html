<style>

    --cream:#F4F1EA; --ink:#2B2723; --ink-soft:#5C564E;

  .warn-card{background:var(--red); color:#fff; border:none; border-radius:12px; padding:14px 16px; margin-bottom:14px; font-size:13px; font-weight:600;}
  .empty{color:var(--ink-soft); font-size:14px; padding:30px 10px; text-align:center;}

  .overlay{position:fixed; inset:0; background:rgba(43,39,35,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .modal{background:var(--cream); width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:22px 20px 28px; max-height:90vh; overflow-y:auto;}
  .modal h2{font-size:19px; color:var(--terracotta-dark); margin-bottom:4px;}
  .modal .sub{font-size:13px; color:var(--ink-soft); margin-bottom:14px;}
  .field{margin-bottom:14px;}

  .btn-cancel{flex:1; background:none; border:1px solid var(--line); padding:13px; border-radius:10px; font-size:15px; color:var(--ink-soft);}
  .btn-save{flex:1.4; background:var(--terracotta); color:#fff; border:none; padding:13px; border-radius:10px; font-size:15px; font-weight:600;}

function toast(msg){
  const t = document.getElementById("toast");
  const dur = msg.length > 40 ? 7000 : 1800;
  t.textContent = msg; t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove("show"), dur);
}
function isoDate(d){ return d.toISOString().slice(0,10); }
function todayStr(){ return isoDate(new Date()); }
function slug(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"_").toLowerCase(); }

async function api(method, path, body){
  const res = await fetch(SUPA_URL + "/rest/v1/" + path, {
    method,
    headers:{
      "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY,
      "Content-Type":"application/json",
      "Prefer": (method==="PATCH"||method==="POST") ? "return=representation" : ""
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok){ throw new Error(await res.text()); }
  return res.status === 204 ? null : res.json();
}
async function uploadPhoto(dataUrl, path){

  const res = await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${path}`, {

    headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY, "Content-Type":"image/jpeg", "x-upsert":"true" },
    body: blob
  });
  if(!res.ok) throw new Error(await res.text());
  return `${SUPA_URL}/storage/v1/object/public/${BUCKET}/${path}`;
}

function weekWindow(d){
  const day = (d.getDay()+6)%7;
  const start = new Date(d); start.setDate(d.getDate()-day);
  const end = new Date(start); end.setDate(start.getDate()+6);
  return {start, end};
}
function biweekWindow(d){
  const day = d.getDate();
  const start = day<=15 ? new Date(d.getFullYear(),d.getMonth(),1) : new Date(d.getFullYear(),d.getMonth(),16);
  const end = day<=15 ? new Date(d.getFullYear(),d.getMonth(),15) : new Date(d.getFullYear(),d.getMonth()+1,0);
  return {start, end};
}
function month3Window(d){
  const start = new Date(d.getFullYear(), d.getMonth(), 15);
  const end = new Date(d.getFullYear(), d.getMonth(), 21);
  return {start, end};
}
function monthWindow(d){
  const start = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return {start, end};
}
function monthStartWindow(d){
  const start = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = new Date(d.getFullYear(), d.getMonth(), 3);
  return {start, end};
}
function windowFor(freq, d){
  if(freq==="semanal") return weekWindow(d);
  if(freq==="quinzenal") return biweekWindow(d);
  if(freq==="mensal_inicio") return monthStartWindow(d);
  if(freq==="mensal") return monthWindow(d);
  return month3Window(d);
}
function inRange(dateStr, start, end){
  const d = new Date(dateStr+"T00:00:00");
  return d>=start && d<=end;
}
function isLastDaysOfMonth(threshold=3){
  const d = new Date();
  const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  return d.getDate() > lastDay - threshold;
}
const CATEGORY_DOW = { raspadinhas:1, cafe:2, laranja:3, tabaco:4 };
const DOW_LABELS = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
function findWeekdayInRange(start, end, dow){
  let d = new Date(start);
  while((((d.getDay()+6)%7)+1) !== dow && d<=end){ d.setDate(d.getDate()+1); }
  return d>end ? end : d;
}
function invStatus(catKey, freq){
  const today = new Date();
  const w = windowFor(freq, today);
  const rows = invRows.filter(r=>r.categoria===catKey && inRange(r.data, w.start, w.end));
  const dow = CATEGORY_DOW[catKey];
  if(rows.length>0){
    let diaErrado = false;
    if(dow){
      const dataCerta = findWeekdayInRange(w.start, w.end, dow);
      const dataCertaStr = isoDate(dataCerta);
      diaErrado = !rows.some(r=>r.data===dataCertaStr);
    }
    return {state:"ok", latest: rows[0], window:w, diaErrado, dowLabel: dow?DOW_LABELS[dow-1]:null};
  }
  if(dow){
    const targetDate = findWeekdayInRange(w.start, w.end, dow);
    const graceDate = new Date(targetDate); graceDate.setDate(graceDate.getDate()+1);
    return {state: today>graceDate ? "late" : "pend", latest:null, window:w, targetDate, dowLabel:DOW_LABELS[dow-1]};
  }
  return {state: today>w.end ? "late" : "pend", latest:null, window:w};
}
function dailyStatus(tipo, dateStr, turno){
  return dailyRows.find(r=>r.tipo===tipo && r.data===dateStr && r.turno===turno) || null;
}

function openCapture(kind, key, label, turno){

      <label class="filebtn">📷 Tirar foto<input type="file" accept="image/*" capture="environment" id="capFile"></label>
      <img id="capPreview" class="cam-preview" style="display:none;">
      ${isInv ? `
        <div class="field" style="margin-top:16px;">
          <label>Valor do inventário (€)</label>
          <input id="vInv" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
        </div>
        ${key==="global" ? `
        <div class="field">
          <label>Valor CNVs (consumíveis) (€)</label>
          <input id="vCnvs" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
        </div>
        <div class="field">
          <label>Foto da entrada justificada</label>
          <label class="filebtn" style="display:block; text-align:center;">📷 Tirar foto<input type="file" accept="image/*" capture="environment" id="capFileEntrada"></label>
          <img id="capPreviewEntrada" class="cam-preview" style="display:none;">
        </div>
        <div class="field">
          <label>Foto do desperdício</label>
          <label class="filebtn" style="display:block; text-align:center;">📷 Tirar foto<input type="file" accept="image/*" capture="environment" id="capFileDesperdicio"></label>
          <img id="capPreviewDesperdicio" class="cam-preview" style="display:none;">
        </div>` : ``}
      ` : ``}
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeCapture()">Cancelar</button>
        <button class="btn-save" id="capSaveBtn" onclick="confirmCapture('${kind}','${key}','${turno||''}')" disabled>Guardar</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("capFile").addEventListener("change", handleCapFile);
  const entradaInput = document.getElementById("capFileEntrada");
  if(entradaInput) entradaInput.addEventListener("change", handleCapFileEntrada);
  const desperdicioInput = document.getElementById("capFileDesperdicio");

}
function closeCapture(){
  const o = document.getElementById("capOverlay");
  if(o) o.remove();
  pendingPhoto = null;
  pendingPhotoEntrada = null;
  pendingPhotoDesperdicio = null;
}
function handleCapFileEntrada(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 1280;
      let {width,height} = img;
      if(width>height && width>maxDim){ height=height*maxDim/width; width=maxDim; }
      else if(height>maxDim){ width=width*maxDim/height; height=maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width=width; canvas.height=height;
      canvas.getContext("2d").drawImage(img,0,0,width,height);
      pendingPhotoEntrada = canvas.toDataURL("image/jpeg",0.7);
      const prev = document.getElementById("capPreviewEntrada");
      prev.src = pendingPhotoEntrada; prev.style.display="block";
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}

function handleCapFile(e){

  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 1280;
      let {width,height} = img;
      if(width>height && width>maxDim){ height=height*maxDim/width; width=maxDim; }
      else if(height>maxDim){ width=width*maxDim/height; height=maxDim; }
      const canvas = document.createElement("canvas");
      canvas.width=width; canvas.height=height;
      canvas.getContext("2d").drawImage(img,0,0,width,height);

      prev.src = pendingPhoto; prev.style.display="block";
      document.getElementById("capSaveBtn").disabled = false;
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
}
async function confirmCapture(kind, key, turno){
  if(!pendingPhoto){ toast("Tira a foto primeiro"); return; }
  const today = todayStr();
  const item = {
    kind, key, turno, today, loja: currentLoja,
    foto: pendingPhoto,
    fotoEntrada: pendingPhotoEntrada || null,
    fotoDesperdicio: pendingPhotoDesperdicio || null,
    vInv: kind==="inv" ? document.getElementById("vInv").value : null,
    vCnvs: (kind==="inv" && document.getElementById("vCnvs")) ? document.getElementById("vCnvs").value : null
  };
  try{
    await enviarItem(item);
    toast("Registado! Obrigado 🙌");
    closeCapture();
    await loadAll();
  }catch(e){
    console.error(e);
    guardarNaFila(item);
    toast("Sem ligação — guardado no telemóvel, vai ser enviado sozinho assim que voltar a internet.");
    closeCapture();
  }
}

async function enviarItem(item){
  const {kind, key, turno, today, loja, foto, fotoEntrada, fotoDesperdicio, vInv, vCnvs} = item;
  if(kind==="daily"){
    const path = `${slug(loja)}/${key}/${turno}/${today}_${Date.now()}.jpg`;
    const url = await uploadPhoto(foto, path);
    await upsertDaily(loja, key, today, url, turno);
  } else if(kind==="marketing"){
    const path = `${slug(loja)}/marketing/${key}/${today}.jpg`;
    const url = await uploadPhoto(foto, path);
    await api("POST", "cj_inventario_reportes", {
      loja, categoria:key, data:today, foto_path:url,
      valor_inventario:null, valor_cnvs:null, enviado_por:loja
    });
  } else {
    const vInvN = parseFloat(vInv);
    const vCnvsN = parseFloat(vCnvs);
    const path = `${slug(loja)}/inventario/${key}/${today}.jpg`;
    const url = await uploadPhoto(foto, path);
    let fotoEntradaUrl = null;
    if(fotoEntrada) fotoEntradaUrl = await uploadPhoto(fotoEntrada, `${slug(loja)}/inventario/${key}/entrada_${today}_${Date.now()}.jpg`);
    let fotoDesperdicioUrl = null;
    if(fotoDesperdicio) fotoDesperdicioUrl = await uploadPhoto(fotoDesperdicio, `${slug(loja)}/inventario/${key}/desperdicio_${today}_${Date.now()}.jpg`);
    const payload = {
      loja, categoria:key, data:today, foto_path:url,
      valor_inventario: isNaN(vInvN)?null:vInvN, valor_cnvs: isNaN(vCnvsN)?null:vCnvsN, enviado_por:loja
    };
    if(key==="global"){
      payload.foto_entrada_cnvs = fotoEntradaUrl;
      payload.foto_desperdicio_cnvs = fotoDesperdicioUrl;
    }
    await api("POST", "cj_inventario_reportes", payload);
  }
}

function guardarNaFila(item){
  try{
    const fila = JSON.parse(localStorage.getItem("cj_fila_envio") || "[]");
    fila.push(item);
    localStorage.setItem("cj_fila_envio", JSON.stringify(fila));
  }catch(e){ console.error(e); }
}

async function tentarReenviarFila(){
  let fila = [];
  try{ fila = JSON.parse(localStorage.getItem("cj_fila_envio") || "[]"); }catch(e){ return; }
  if(fila.length===0) return;
  const restantes = [];
  for(const item of fila){
    try{
      await enviarItem(item);
    }catch(e){
      restantes.push(item);
    }
  }
  localStorage.setItem("cj_fila_envio", JSON.stringify(restantes));
  if(restantes.length < fila.length){
    toast(`${fila.length - restantes.length} envio(s) pendente(s) foram enviados agora`);
    await loadAll();
  }
}
window.addEventListener("online", tentarReenviarFila);

loadAll();
tentarReenviarFila();
setInterval(loadAll, 30000);

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("cj_dark_mode", document.body.classList.contains("dark") ? "1" : "0");
  document.getElementById("darkToggle").textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
}
if(localStorage.getItem("cj_dark_mode")==="1"){
  document.body.classList.add("dark");
  setTimeout(()=>{ const b=document.getElementById("darkToggle"); if(b) b.textContent="☀️"; }, 0);
}
</script>
