<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
<title>CoreJoint</title>
<link rel="manifest" href="manifest-hub.json">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#FAF7F2;}
  #topbar{background:#fff; padding:14px 18px 10px; border-bottom:1px solid #e8ddc9; flex-shrink:0;}
  #topbar .logo{color:#C1622D; font-weight:800; font-size:22px; font-family:'Syne',sans-serif;}
  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}
  #frames{flex:1; position:relative; overflow:hidden;}
  #frames iframe{position:absolute; top:0; left:0; width:100%; height:100%; border:none; background:#FAF7F2;}
  #tabbar{display:flex; background:#fff; border-top:1px solid #e8ddc9; flex-shrink:0; padding-bottom:env(safe-area-inset-bottom, 0);}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px 2px 10px; background:none; border:none; font-family:inherit; cursor:pointer; color:#8a7d6b;}
  .tab.active{color:#C1622D;}
  .tab .ic{font-size:20px;}
  .tab .lb{font-size:10px; font-weight:700;}
  .loading-msg{position:absolute; top:50%; left:0; right:0; text-align:center; color:#8a7d6b; font-size:13px; transform:translateY(-50%);}
</style>
</head>
<body>
<div id="app">
  <div id="topbar"><span class="logo">CoreJoint</span></div>
  <div id="frames">
    <div class="loading-msg" id="loadingMsg">A carregar…</div>
    <iframe id="frame-dashboard" src="CoreJoint_Hub.html" style="z-index:5;"></iframe>
    <iframe id="frame-reportes" data-src="CoreJoint_Reportes.html" style="display:none;"></iframe>
    <iframe id="frame-sondagens" data-src="CoreJoint_Reportes.html?abrir=sondagem" style="display:none;"></iframe>
    <iframe id="frame-fardamento" data-src="CoreJoint_Fardamento.html" style="display:none;"></iframe>
    <iframe id="frame-rh" data-src="CoreJoint_Adendas.html" style="display:none;"></iframe>
  </div>
  <div id="tabbar">
    <button class="tab active" data-tab="dashboard"><span class="ic">🏠</span><span class="lb">Dashboard</span></button>
    <button class="tab" data-tab="reportes"><span class="ic">📊</span><span class="lb">Reportes</span></button>
    <button class="tab" data-tab="sondagens"><span class="ic">📋</span><span class="lb">Sondagens</span></button>
    <button class="tab" data-tab="fardamento"><span class="ic">👕</span><span class="lb">Fardamento</span></button>
    <button class="tab" data-tab="rh"><span class="ic">🗂️</span><span class="lb">RH</span></button>
  </div>
</div>

<script>
document.getElementById("frame-dashboard").addEventListener("load", ()=>{
  const msg = document.getElementById("loadingMsg");
  if(msg) msg.remove();
});

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const tab = btn.dataset.tab;
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active", b===btn));
    document.querySelectorAll("#frames iframe").forEach(f=>f.style.display="none");
    const frame = document.getElementById(`frame-${tab}`);
    // Carrega o conteúdo só na primeira vez que a aba é aberta (poupa dados/memória)
    if(!frame.getAttribute("src") && frame.dataset.src){
      frame.setAttribute("src", frame.dataset.src);
    }
    frame.style.display = "block";
    frame.style.zIndex = "5";
  });
});
</script>
</body>
</html>
