async function api(path, method, body){
  const opts = { method: method||"GET", headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY, "Content-Type":"application/json", "Prefer": (method==="POST"||method==="PATCH") ? "return=representation" : "" } };
  if(body) opts.body = JSON.stringify(body);

}

function categoriasParaLoja(loja){
  return INV_CATS.filter(c=>{
    if(c.key==="raspadinhas") return JSC_LOJAS.includes(loja);
    if(c.key==="tabaco") return !TABACO_EXCLUIR.includes(loja);
    return true;
  });
}
function weekWindow(d){ const day=(d.getDay()+6)%7; const start=new Date(d); start.setDate(d.getDate()-day); const end=new Date(start); end.setDate(start.getDate()+6); return {start,end}; }
function biweekWindow(d){ const day=d.getDate(); const start = day<=15 ? new Date(d.getFullYear(),d.getMonth(),1) : new Date(d.getFullYear(),d.getMonth(),16); const end = day<=15 ? new Date(d.getFullYear(),d.getMonth(),15) : new Date(d.getFullYear(),d.getMonth()+1,0); return {start,end}; }
function month3Window(d){ return {start:new Date(d.getFullYear(),d.getMonth(),15), end:new Date(d.getFullYear(),d.getMonth(),21)}; }
function monthWindow(d){ return {start:new Date(d.getFullYear(),d.getMonth(),1), end:new Date(d.getFullYear(),d.getMonth()+1,0)}; }
function semestreWindow(d){ const mes=d.getMonth(); const inicioMes = mes<6?0:6; return {start:new Date(d.getFullYear(),inicioMes,1), end:new Date(d.getFullYear(),inicioMes+6,0)}; }
function monthStartWindow(d){ return {start:new Date(d.getFullYear(),d.getMonth(),1), end:new Date(d.getFullYear(),d.getMonth(),3)}; }
function monthDia20Window(d){ return {start:new Date(d.getFullYear(),d.getMonth(),1), end:new Date(d.getFullYear(),d.getMonth(),20)}; }
function julDezWindow(d){ const mes=d.getMonth(); const alvoMes = mes<=5?6:11; return {start:new Date(d.getFullYear(),alvoMes,1), end:new Date(d.getFullYear(),alvoMes+1,0)}; }
function windowFor(freq,d){
  if(freq==="semanal") return weekWindow(d);
  if(freq==="quinzenal") return biweekWindow(d);
  if(freq==="mensal_inicio") return monthStartWindow(d);
  if(freq==="mensal_dia20") return monthDia20Window(d);
  if(freq==="mensal") return monthWindow(d);
  if(freq==="semestral") return semestreWindow(d);
  if(freq==="semestral_jul_dez") return julDezWindow(d);
  return month3Window(d);
}
function findWeekdayInRange(start,end,dow){ let d=new Date(start); while((((d.getDay()+6)%7)+1)!==dow && d<=end) d.setDate(d.getDate()+1); return d>end?end:d; }
function inRange(dateStr,start,end){ const d=new Date(dateStr+"T00:00:00"); return d>=start && d<=end; }

async function enviarLembretesAtrasos(){
  const btn = document.getElementById("lembretesAtrasosBtn");
  btn.disabled = true;
  const MAX_TENTATIVAS = 3;
  for(let tentativa=1; tentativa<=MAX_TENTATIVAS; tentativa++){
    btn.textContent = tentativa===1 ? "A enviar..." : `A tentar outra vez (${tentativa}/${MAX_TENTATIVAS})...`;
    try{
      const res = await fetch(`${SUPA_URL}/functions/v1/send-daily-alerts`);
      if(!res.ok){
        if(tentativa<MAX_TENTATIVAS){ await new Promise(r=>setTimeout(r, 1500)); continue; }
        alert(`O servidor respondeu com erro (${res.status}) depois de ${MAX_TENTATIVAS} tentativas. Tenta outra vez daqui a um minuto.`);
        break;
      }
      const texto = await res.text();
      let data;
      try{ data = JSON.parse(texto); }
      catch(parseErr){
        if(tentativa<MAX_TENTATIVAS){ await new Promise(r=>setTimeout(r, 1500)); continue; }
        alert("A ligação falhou a meio (resposta inválida do servidor), mesmo depois de tentar de novo. Verifica a internet.");
        break;
      }
      alert(`Lembretes enviados! ${data.lojas ? data.lojas.sent + ' loja(s) notificada(s)' : (data.message || 'Sem pendências para lembrar.')}`);
      break;
    }catch(e){
      console.error(e);
      if(tentativa<MAX_TENTATIVAS){ await new Promise(r=>setTimeout(r, 1500)); continue; }
      alert("Não foi possível ligar ao servidor, mesmo depois de tentar de novo. Verifica a internet.");
    }
  }
  btn.disabled = false; btn.textContent = "🔔 Enviar lembrete dos atrasos a cada loja";
}

async function fetchComRetry(url, tentativas=3){
  for(let i=1; i<=tentativas; i++){
    try{
      const res = await fetch(url);
      if(res.ok) return res;
      if(i===tentativas) throw new Error(`Servidor respondeu ${res.status}`);
    }catch(e){
      if(i===tentativas) throw e;
    }
    await new Promise(r=>setTimeout(r, 1200));
  }
}

async function enviarAvisoTodos(){
  const texto = document.getElementById("avisoTodosTexto").value.trim();
  if(!texto){ alert("Escreve uma mensagem primeiro"); return; }
  const btn = document.getElementById("avisoTodosEnviarBtn");
  btn.disabled = true; btn.textContent = "A enviar...";
  const falharam = [];
  for(const loja of LOJAS){
    try{
      await api("cj_avisos", "POST", {loja, tipo:"outro", descricao:texto, criado_por:"CG"});
    }catch(e){
      console.error(`Falhou registar aviso para ${loja}`, e);
      falharam.push(loja);
      continue;
    }
    try{
      await fetchComRetry(`${SUPA_URL}/functions/v1/send-daily-alerts?tipo=aviso&loja=${encodeURIComponent(loja)}&avisoTipo=outro&descricao=${encodeURIComponent(texto)}`, 2);
    }catch(e){
      console.error(`Registo guardado mas notificação push falhou para ${loja}`, e);
    }
  }
  document.getElementById("avisoTodosOverlay").remove();
  if(falharam.length===0){
    alert("Aviso enviado a todas as lojas!");
  } else {
    alert(`Aviso enviado, mas falhou registar para: ${falharam.join(", ")}. Tenta enviar de novo só para essas.`);
  }
}

function bigPhoto(urls, indice){
  const old = document.getElementById('_lb');
  if(old) document.body.removeChild(old);
  if(!urls || urls.length===0) return;
  let idx = indice || 0;

  const lb = document.createElement('div');
  lb.id = '_lb';
  lb.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.95);z-index:2147483647;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom;';

  const img = document.createElement('img');
  img.style.cssText = 'max-width:96vw;max-height:90vh;object-fit:contain;border-radius:6px;display:block;';

  const contador = document.createElement('div');
  contador.style.cssText = 'position:absolute;top:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:99px;';

  function atualizar(){ img.src = urls[idx]; contador.textContent = urls.length>1 ? `${idx+1} / ${urls.length}` : ''; }
  atualizar();

  const x = document.createElement('div');
  x.style.cssText = 'position:absolute;top:10px;right:16px;color:#fff;font-size:2.5rem;line-height:1;font-weight:200;cursor:pointer;z-index:2;';
  x.textContent = '×';
  x.onclick = (e)=>{ e.stopPropagation(); document.body.removeChild(lb); };

  lb.appendChild(img); lb.appendChild(x); lb.appendChild(contador);

  if(urls.length>1){
    const prev = document.createElement('div');
    prev.textContent = '‹';
    prev.style.cssText = 'position:absolute;left:6px;top:50%;transform:translateY(-50%);color:#fff;font-size:2.8rem;padding:10px 14px;cursor:pointer;z-index:2;user-select:none;';
    prev.onclick = (e)=>{ e.stopPropagation(); idx = (idx-1+urls.length)%urls.length; atualizar(); };
    const next = document.createElement('div');
    next.textContent = '›';
    next.style.cssText = 'position:absolute;right:6px;top:50%;transform:translateY(-50%);color:#fff;font-size:2.8rem;padding:10px 14px;cursor:pointer;z-index:2;user-select:none;';
    next.onclick = (e)=>{ e.stopPropagation(); idx = (idx+1)%urls.length; atualizar(); };
    lb.appendChild(prev); lb.appendChild(next);
  }

  lb.onclick = ()=>document.body.removeChild(lb);
  document.body.appendChild(lb);
}

(async ()=>{
  const attn = [];
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  let statReportes = 0, statAtrasados = 0, statFardamento = 0, statAdendas = 0;
  const aindaNaoComecou = new Date() < RESET_GRACE_UNTIL;

  try{
    const daily = await api(`cj_daily_reportes?select=loja,tipo,turno&data=eq.${todayStr}`);
    let reportesPend = 0;
    const semVitrine = [], semVendas = [];
    if(!aindaNaoComecou){
      LOJAS.forEach(l=>{
        const turnos = ["manha","almoco","lanche"].filter(t=>daily.some(r=>r.loja===l && r.tipo==="vitrine" && r.turno===t)).length;

        if(!daily.some(r=>r.loja===l && r.tipo==="vendas" && r.turno==="unico")){ reportesPend++; semVendas.push(l); }

    setBadge("badge-reportes", reportesPend);
    statReportes = reportesPend;
    if(semVitrine.length) addAttn(attn, "CoreJoint_Reportes.html", `🌇 ${semVitrine.length} loja(s) sem vitrine completa hoje`, semVitrine.slice(0,4).join(", ") + (semVitrine.length>4?" e mais...":""), true);
    if(semVendas.length) addAttn(attn, "CoreJoint_Reportes.html", `🧾 ${semVendas.length} loja(s) sem vendas hoje`, semVendas.slice(0,4).join(", ") + (semVendas.length>4?" e mais...":""), true);

    const invRows = await api("cj_inventario_reportes?select=loja,categoria,data");
    const naoAplicaveisRows = await api("cj_categoria_nao_aplicavel?select=loja,categoria");
    let atrasadosN = 0;
    LOJAS.forEach(loja=>{
      [...categoriasParaLoja(loja), ...MARKETING_CATS].filter(cat=>!naoAplicaveisRows.some(n=>n.loja===loja && n.categoria===cat.key)).forEach(cat=>{
        const w = windowFor(cat.freq, today);
        const rowsCat = invRows.filter(r=>r.loja===loja && r.categoria===cat.key && inRange(r.data, w.start, w.end));
        if(rowsCat.length>0) return;
        const dow = CATEGORY_DOW[cat.key];
        let late = false;
        let deadline;
        if(dow){
          const target = findWeekdayInRange(w.start,w.end,dow);
          deadline = new Date(target); deadline.setDate(deadline.getDate()+1); deadline.setHours(14,0,0,0);
        } else {
          deadline = w.end;
        }
        if(deadline < RESET_GRACE_UNTIL) return; // prazo era antes do reset, não conta
        late = today > deadline;
        if(late) atrasadosN++;
      });
    });
    if(atrasadosN>0) addAttn(attn, "CoreJoint_Reportes.html", `📦 ${atrasadosN} inventário(s)/marketing atrasado(s)`, "Toca para ver quais lojas e categorias", true);
    statAtrasados = atrasadosN;
  }catch(e){}

  try{
    const stock = await api("cj_fardamento_stock?select=quantidade&quantidade=lt.5");
    const dev = await api("cj_fardamento_devolucoes?select=id&recolhido=eq.false");
    setBadge("badge-fardamento", stock.length + dev.length);
    statFardamento = stock.length + dev.length;
    if(stock.length) addAttn(attn, "CoreJoint_Fardamento.html", `👕 ${stock.length} combinação(ões) de fardamento com stock baixo`, "Toca para ver quais peças e tamanhos", false);
    if(dev.length) addAttn(attn, "CoreJoint_Fardamento.html", `↩ ${dev.length} devolução(ões) por recolher`, "Toca para ver em que lojas", false);
  }catch(e){}

  try{
    const adendas = await api("cj_adendas?select=id,updated_at,criado_em&arquivada=eq.false");
    setBadge("badge-adendas", adendas.length);
    statAdendas = adendas.length;
    const paradas = adendas.filter(r=>{
      const ref = r.updated_at || r.criado_em;
      const dias = Math.floor((Date.now() - new Date(ref).getTime())/86400000);
      return dias>=3;
    });
    if(paradas.length) addAttn(attn, "CoreJoint_Adendas.html", `📋 ${paradas.length} adenda(s) parada(s) há 3+ dias`, "Toca para ver quais precisam de ação", true);
  }catch(e){}

  try{
    const desde = new Date(Date.now() - 2*86400000).toISOString().slice(0,10);
    const dailyFotos = await api(`cj_daily_reportes?select=loja,tipo,turno,data,fotos,criado_em&data=gte.${desde}&order=criado_em.desc&limit=40`);
    const invFotos = await api(`cj_inventario_reportes?select=loja,categoria,data,fotos,criado_em&data=gte.${desde}&order=criado_em.desc&limit=40`);
    const TURNO_LABELS_H = {manha:"Manhã", almoco:"Almoço", lanche:"Lanche", unico:""};
    const todasCatsLabel = {};
    [...INV_CATS, ...MARKETING_CATS].forEach(c=>todasCatsLabel[c.key]=c.label);
    function fotoUrlH(f){ return typeof f === "string" ? f : (f && f.url) || ""; }
    function fotoLegendaH(f){ return (f && typeof f === "object" && f.legenda) || ""; }

    const submissoes = [];
    dailyFotos.forEach(r=>{
      if(!(r.fotos||[]).length) return;
      submissoes.push({loja:r.loja, titulo: r.tipo==="vitrine" ? `Vitrine — ${TURNO_LABELS_H[r.turno]||r.turno}` : "Vendas", data:r.data, criado_em:r.criado_em, fotos:r.fotos});
    });
    invFotos.forEach(r=>{
      if(!(r.fotos||[]).length) return;
      submissoes.push({loja:r.loja, titulo: todasCatsLabel[r.categoria]||r.categoria, data:r.data, criado_em:r.criado_em, fotos:r.fotos});
    });
    submissoes.sort((a,b)=> new Date(b.criado_em) - new Date(a.criado_em));
    const porLoja = {};
    submissoes.forEach(s=>{ (porLoja[s.loja] ||= []).push(s); });

    if(Object.keys(porLoja).length>0){
      let html = `<div class="sec-label">Fotos recentes</div>`;
      const gruposUrls = [];
      LOJAS.filter(l=>porLoja[l]).forEach(l=>{
        html += `<div class="card" style="flex-direction:column; align-items:stretch; gap:0;">
          <div style="font-family:'Syne',sans-serif; font-weight:700; font-size:.9rem; margin-bottom:10px;">${l}</div>`;
        porLoja[l].slice(0,4).forEach(s=>{
          const urls = s.fotos.map(fotoUrlH);
          const gi = gruposUrls.push(urls) - 1;
          const leg = fotoLegendaH(s.fotos[0]);
          html += `
            <div style="font-size:.72rem; font-weight:700; color:var(--t2); margin-bottom:6px;">${s.titulo} · ${new Date(s.data+"T00:00:00").toLocaleDateString('pt-PT',{weekday:'short',day:'2-digit',month:'2-digit'})}</div>
            <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px;">
              ${urls.map((u,fi)=>`<img src="${u}" data-gi="${gi}" data-fi="${fi}" style="flex-shrink:0; width:130px; height:100px; object-fit:cover; border-radius:8px; border:1px solid var(--br); cursor:pointer; display:block;">`).join("")}
            </div>
            <div style="font-style:italic; font-size:.68rem; color:var(--t3); margin-bottom:12px;">${leg || "Sem comentário"}</div>
          `;
        });
        html += `</div>`;
      });
      const wrap = document.createElement("div");
      wrap.innerHTML = html;
      wrap.querySelectorAll("img[data-gi]").forEach(img=>{
        img.addEventListener("click", ()=>{
          bigPhoto(gruposUrls[+img.dataset.gi], +img.dataset.fi);
        });
      });
      document.getElementById("fotosRecentesSection").innerHTML = "";
      document.getElementById("fotosRecentesSection").appendChild(wrap);
    }
  }catch(e){ console.error(e); }

  try{
    const dailyForPainel = await api(`cj_daily_reportes?select=loja,tipo,turno&data=eq.${todayStr}`);
    const invForPainel = await api("cj_inventario_reportes?select=loja,categoria,data");
    const naoAplicaveisPainel = await api("cj_categoria_nao_aplicavel?select=loja,categoria");
    const mesAtualPainel = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
    const agendamentosPainel = await api(`cj_global_agendamento?select=loja,mes&mes=eq.${mesAtualPainel}`);

    const dadosPorLoja = LOJAS.map(l=>{
      const vitOk = ["manha","almoco","lanche"].filter(t=>dailyForPainel.some(r=>r.loja===l && r.tipo==="vitrine" && r.turno===t)).length;
      const vendasOk = dailyForPainel.some(r=>r.loja===l && r.tipo==="vendas" && r.turno==="unico");
      let atrasadosLoja = 0;
      [...categoriasParaLoja(l), ...MARKETING_CATS].filter(cat=>!naoAplicaveisPainel.some(n=>n.loja===l && n.categoria===cat.key)).forEach(cat=>{
        const w = windowFor(cat.freq, today);
        const rowsCat = invForPainel.filter(r=>r.loja===l && r.categoria===cat.key && inRange(r.data, w.start, w.end));
        if(rowsCat.length>0) return;
        const dow = CATEGORY_DOW[cat.key];
        let deadline;
        if(dow){ const target = findWeekdayInRange(w.start,w.end,dow); deadline = new Date(target); deadline.setDate(deadline.getDate()+1); deadline.setHours(14,0,0,0); }
        else deadline = w.end;
        if(deadline < RESET_GRACE_UNTIL) return;
        if(today > deadline) atrasadosLoja++;
      });
      let globalNaoMarcado = false;
      if(today.getDate()>5) globalNaoMarcado = !agendamentosPainel.some(a=>a.loja===l);
      const pendencias = [];
      if(!aindaNaoComecou){
        if(vitOk<3) pendencias.push(`Vitrine ${vitOk}/3`);
        if(!vendasOk) pendencias.push("Vendas por fazer");
        if(atrasadosLoja>0) pendencias.push(`${atrasadosLoja} atrasado(s)`);
        if(globalNaoMarcado) pendencias.push("Global não marcado");
      }
      return {loja:l, pendencias, urgente: pendencias.length};
    });

    const comPendencia = dadosPorLoja.filter(d=>d.pendencias.length>0);
    const semPendencia = dadosPorLoja.filter(d=>d.pendencias.length===0);

    let html = `<div class="sec-label" style="display:flex; justify-content:space-between; align-items:center;">
      <span>Painel de gestão</span>
      <a href="CoreJoint_Reportes.html" style="font-size:.75rem; color:var(--tc); text-decoration:none; font-weight:700;">Ver detalhe →</a>
    </div>`;
    if(comPendencia.length===0){
      html += `<div class="all-clear" style="margin-bottom:14px;">✔ Todas as lojas em dia agora.</div>`;
    } else {
      html += `<a href="CoreJoint_Reportes.html" class="card" style="display:flex; justify-content:space-between; align-items:center; text-decoration:none; color:inherit;">
        <span style="font-weight:700; font-size:.9rem;">${comPendencia.length} loja(s) com pendências</span>
        <span style="font-size:.78rem; color:var(--t2);">${semPendencia.length} em dia ›</span>
      </a>`;
    }
    document.getElementById("painelLojasSection").innerHTML = html;
  }catch(e){ console.error(e); }

  document.getElementById("statsGrid").innerHTML = `
    <a class="sc" href="CoreJoint_Reportes.html" style="text-decoration:none; display:block;"><div class="slb">Reportes</div><div class="svl ${statReportes>0?'cr':'cg'}">${statReportes}</div></a>
    <a class="sc" href="CoreJoint_Reportes.html" style="text-decoration:none; display:block;"><div class="slb">Atrasados</div><div class="svl ${statAtrasados>0?'cr':'cg'}">${statAtrasados}</div></a>
    <a class="sc" href="CoreJoint_Fardamento.html" style="text-decoration:none; display:block;"><div class="slb">Fardamento</div><div class="svl ${statFardamento>0?'cr':'cg'}">${statFardamento}</div></a>
    <a class="sc" href="CoreJoint_Adendas.html" style="text-decoration:none; display:block;"><div class="slb">RH</div><div class="svl ${statAdendas>0?'cr':'cg'}">${statAdendas}</div></a>
  `;

  const section = document.getElementById("attnSection");
  if(attn.length===0){
    section.innerHTML = `<div class="all-clear">✔ Tudo em dia — nada precisa da tua atenção agora.</div>`;
    return;
  }
  section.innerHTML = `<div style="text-align:center; font-size:.8rem; color:var(--t2); margin-bottom:14px;">${attn.length} coisa${attn.length>1?'s':''} a precisar de atenção — toca numa app abaixo para ver.</div>`;
})();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', {scope: './'}).catch(e=>console.warn('sw.js falhou', e));
}
// Verifica automaticamente se há uma versão nova publicada e recarrega sozinho
let versaoInicial = null;
async function verificarAtualizacao(){
  try{
    const res = await fetch("version.json?t=" + Date.now(), {cache:"no-store"});
    const dados = await res.json();
    const marca = dados.v;
    if(!marca) return;
    if(versaoInicial === null){ versaoInicial = marca; return; }
    if(marca !== versaoInicial){
      const overlayAberto = document.querySelector(".overlay");
      if(!overlayAberto){
        location.reload();
      }
    }
  }catch(e){ /* falha silenciosa, tenta outra vez depois */ }
}
setInterval(verificarAtualizacao, 90*1000);
verificarAtualizacao();

</script>
