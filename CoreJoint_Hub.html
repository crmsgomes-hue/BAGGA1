<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, user-scalable=yes">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>CoreJoint</title>
<link rel="manifest" href="manifest-hub.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#C1622D">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F2;--bg2:#f1ebdc;--sf:#fff;--sf2:#f3eee2;--br:#e8ddc9;--ac:#C1622D;--ac2:#9c4d23;--acl:#fbeee5;--tx:#2b2118;--t2:#6b5d4f;--t3:#a8987f;--red:#B0432F;--org:#c17817;--grn:#5C7A5C;--blu:#1a56db;--ra:10px;--rb:7px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;overflow-x:hidden}
body.dark{--bg:#1c1a18;--sf:#2A2724;--sf2:#242220;--br:#3a3632;--tx:#EDE8E1;--t2:#B8B0A5;--t3:#8a8178;--ac:#E08A52;--ac2:#F0A876;--acl:#3a2c24;}
body.dark .al-w{background:#3a2f1a;color:#f0c078;}
body.dark .al-d{background:#3a201d;color:#f08a7a;}
body.dark .al-g{background:#1e2e22;color:#8fc79a;}
body.dark .al-i{background:#1a2a3a;color:#7ab0f0;}
#HD{display:flex;align-items:center;padding:0 14px;height:50px;background:var(--sf);border-bottom:1px solid var(--br);position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.hlog{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;color:var(--ac)}
.hbtn{margin-left:auto;background:var(--sf2);border:1.5px solid var(--br);color:var(--t2);cursor:pointer;font-size:.85rem;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
#MN{flex:1;padding:14px;max-width:600px;margin:0 auto;width:100%}
.pt{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;margin-bottom:2px}
.ps{font-size:.76rem;color:var(--t2);margin-bottom:14px}
.al{padding:10px 13px;border-radius:var(--rb);margin-bottom:10px;font-size:.8rem;border-left:3px solid;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-decoration:none;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px;}
@media(max-width:380px){.g4{grid-template-columns:1fr 1fr;}}
.sc{background:var(--sf);border:1px solid var(--br);border-radius:var(--ra);padding:13px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.slb{font-size:.67rem;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:2px;}
.svl{font-family:'Syne',sans-serif;font-size:1.45rem;font-weight:800;}
.cr{color:var(--red)}
.cg{color:var(--grn)}
.al-w{background:#fdf6e9;border-color:var(--org);color:#6b4d12}
.al-d{background:#fbeeec;border-color:var(--red);color:var(--red)}
.al-g{background:#eef3ea;border-color:var(--grn);color:var(--grn)}
.al-i{background:#eff6ff;border-color:var(--blu);color:var(--blu)}
.al strong{font-size:.85rem;}
.al .al-sub{font-size:.79rem; opacity:.9;}
.al .al-btn{margin-top:2px; font-size:.75rem; font-weight:700; text-decoration:underline;}
.all-clear{background:var(--grn);color:#fff;border-radius:var(--rb);padding:14px;text-align:center;font-weight:700;font-size:.85rem;margin-bottom:8px;}
.spin-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:30px 0;}
.spin{width:28px;height:28px;border:3px solid var(--br);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-msg{font-size:.78rem; color:var(--t2);}
.card{background:var(--sf);border:1px solid var(--br);border-radius:var(--ra);padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--tx);}
.card .icon{font-size:1.7rem;flex-shrink:0;width:40px;text-align:center;}
.card .ct{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;}
.card .cd{font-size:.76rem;color:var(--t2);margin-top:1px;line-height:1.35}
.bk{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:.72rem;font-weight:700;background:var(--ac);color:#fff;margin-left:8px;}
.card .arrow{margin-left:auto;color:var(--t3);font-size:1.1rem;flex-shrink:0}
.sec-label{font-size:.68rem;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin:16px 0 8px;}
</style>
</head>
<body>
<div id="HD">
  <div class="hlog">CoreJoint</div>
  <button class="hbtn" id="darkToggle" onclick="toggleDark()" style="display:none;">🌙</button>
</div>
<div id="MN">
  <div class="pt">Dashboard</div>
  <div class="ps">As tuas ferramentas de gestão, num só sítio.</div>

  <div id="statsGrid" class="g4"></div>
  <div id="attnSection"><div class="spin-wrap"><div class="spin"></div><div class="spin-msg">A verificar pendências…</div></div></div>

  <div class="sec-label">Apps</div>
  <a class="card" href="CoreJoint_Reportes.html">
    <div class="icon">📸</div>
    <div style="flex:1;"><div class="ct">Reportes</div><div class="cd">Vitrine, vendas e inventário por loja</div></div>
    <span id="badge-reportes"></span>
    <div class="arrow">›</div>
  </a>
  <a class="card" href="CoreJoint_Fardamento.html">
    <div class="icon">👕</div>
    <div style="flex:1;"><div class="ct">Fardamento</div><div class="cd">Stock nos 3 polos, saídas e alertas</div></div>
    <span id="badge-fardamento"></span>
    <div class="arrow">›</div>
  </a>
  <a class="card" href="CoreJoint_Adendas.html">
    <div class="icon">📋</div>
    <div style="flex:1;"><div class="ct">Adendas</div><div class="cd">Controlo de impressão, entrega e assinatura</div></div>
    <span id="badge-adendas"></span>
    <div class="arrow">›</div>
  </a>
</div>
<script>
function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("cj_dark_mode", document.body.classList.contains("dark") ? "1" : "0");
  document.getElementById("darkToggle").textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
}
if(localStorage.getItem("cj_dark_mode")==="1"){
  document.body.classList.add("dark");
  document.getElementById("darkToggle").textContent = "☀️";
}

const SUPA_URL = "https://isdaegejkxgtzjcpzstr.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzZGFlZ2Vqa3hndHpqY3B6c3RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDMzNDMsImV4cCI6MjA5NTk3OTM0M30.M7WZQXo-okNFaYhqF3WMxIB0KO7MsM1OH-JnBPWQ54k";
async function api(path){
  const res = await fetch(`${SUPA_URL}/rest/v1/${path}`, { headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY } });
  if(!res.ok) return [];
  return res.json();
}
function setBadge(id, n){
  if(n>0) document.getElementById(id).innerHTML = `<span class="bk">${n}</span>`;
}

const LOJAS = ["Caldas da Rainha","Bombarral","Peniche","Rio Maior","Santarém","Almeirim","Carregado","Ponte de Sor","Torres MCH","Torres MH"];
const INV_CATS = [
  { key: "raspadinhas", label: "JSC", freq: "semanal" },
  { key: "laranja", label: "Laranja", freq: "semanal" },
  { key: "cafe", label: "Café", freq: "semanal" },
  { key: "tabaco", label: "Tabaco", freq: "quinzenal" },
  { key: "global", label: "Global", freq: "mensal3" },
  { key: "registo_21", label: "Registo 21", freq: "semanal" },
  { key: "legionella", label: "Legionella", freq: "semanal" },
];
const MARKETING_CATS = [
  { key: "cavalete", label: "Cavalete", freq: "mensal_inicio" },
  { key: "toalhetes", label: "Toalhetes", freq: "mensal_inicio" },
  { key: "orelhas", label: "Orelhas", freq: "mensal_inicio" },
  { key: "horarios", label: "Horários", freq: "mensal_inicio" },
  { key: "preventiva_delta", label: "Preventiva Delta", freq: "mensal_inicio" },
  { key: "papel", label: "Legionella (Papel)", freq: "mensal_inicio" },
  { key: "forms", label: "Legionella (Forms)", freq: "mensal_inicio" },
  { key: "haccp", label: "HACCP", freq: "mensal_inicio" },
  { key: "winrest", label: "Winrest", freq: "mensal_inicio" },
  { key: "limpeza_prelatores", label: "Limpeza Prelatores", freq: "semestral" },
];
const JSC_LOJAS = ["Almeirim", "Ponte de Sor"];
const TABACO_EXCLUIR = ["Caldas da Rainha"];
const CATEGORY_DOW = { raspadinhas: 1, cafe: 2, laranja: 3, tabaco: 4 };

function categoriasParaLoja(loja){
  return INV_CATS.filter(c=>{
    if(c.key==="raspadinhas") return JSC_LOJAS.includes(loja);
    if(c.key==="tabaco") return !TABACO_EXCLUIR.includes(loja);
    return true;
  });
}
function weekWindow(d){ const day=(d.getDay()+6)%7; const start=new Date(d); start.setDate(d.getDate()-day); const end=new Date(start); end.setDate(start.getDate()+6); return {start,end}; }
function biweekWindow(d){ const day=d.getDate(); const start = day<=15 ? new Date(d.getFullYear(),d.getMonth(),1) : new Date(d.getFullYear(),d.getMonth(),16); const end = day<=15 ? new Date(d.getFullYear(),d.getMonth(),15) : new Date(d.getFullYear(),d.getMonth()+1,0); return {start,end}; }
function month3Window(d){ return {start:new Date(d.getFullYear(),d.getMonth(),15), end:new Date(d.getFullYear(),d.getMonth(),21)}; }
function monthWindow(d){ return {start:new Date(d.getFullYear(),d.getMonth(),1), end:new Date(d.getFullYear(),d.getMonth()+1,0)}; }
function semestreWindow(d){ const mes=d.getMonth(); const inicioMes = mes<6?0:6; return {start:new Date(d.getFullYear(),inicioMes,1), end:new Date(d.getFullYear(),inicioMes+6,0)}; }
function monthStartWindow(d){ return {start:new Date(d.getFullYear(),d.getMonth(),1), end:new Date(d.getFullYear(),d.getMonth(),3)}; }
function windowFor(freq,d){
  if(freq==="semanal") return weekWindow(d);
  if(freq==="quinzenal") return biweekWindow(d);
  if(freq==="mensal_inicio") return monthStartWindow(d);
  if(freq==="mensal") return monthWindow(d);
  if(freq==="semestral") return semestreWindow(d);
  return month3Window(d);
}
function findWeekdayInRange(start,end,dow){ let d=new Date(start); while((((d.getDay()+6)%7)+1)!==dow && d<=end) d.setDate(d.getDate()+1); return d>end?end:d; }
function inRange(dateStr,start,end){ const d=new Date(dateStr+"T00:00:00"); return d>=start && d<=end; }

function addAttn(list, href, titulo, sub, urgente){
  list.push({href, titulo, sub, urgente});
}

(async ()=>{
  const attn = [];
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);
  let statReportes = 0, statAtrasados = 0, statFardamento = 0, statAdendas = 0;

  try{
    const daily = await api(`cj_daily_reportes?select=loja,tipo,turno&data=eq.${todayStr}`);
    let reportesPend = 0;
    const semVitrine = [], semVendas = [];
    LOJAS.forEach(l=>{
      const turnos = ["manha","almoco","lanche"].filter(t=>daily.some(r=>r.loja===l && r.tipo==="vitrine" && r.turno===t)).length;
      if(turnos<3){ reportesPend++; semVitrine.push(l); }
      if(!daily.some(r=>r.loja===l && r.tipo==="vendas" && r.turno==="unico")){ reportesPend++; semVendas.push(l); }
    });
    setBadge("badge-reportes", reportesPend);
    statReportes = reportesPend;
    if(semVitrine.length) addAttn(attn, "CoreJoint_Reportes.html", `🌇 ${semVitrine.length} loja(s) sem vitrine completa hoje`, semVitrine.slice(0,4).join(", ") + (semVitrine.length>4?" e mais...":""), true);
    if(semVendas.length) addAttn(attn, "CoreJoint_Reportes.html", `🧾 ${semVendas.length} loja(s) sem vendas hoje`, semVendas.slice(0,4).join(", ") + (semVendas.length>4?" e mais...":""), true);

    const invRows = await api("cj_inventario_reportes?select=loja,categoria,data");
    let atrasadosN = 0;
    LOJAS.forEach(loja=>{
      [...categoriasParaLoja(loja), ...MARKETING_CATS].forEach(cat=>{
        const w = windowFor(cat.freq, today);
        const rowsCat = invRows.filter(r=>r.loja===loja && r.categoria===cat.key && inRange(r.data, w.start, w.end));
        if(rowsCat.length>0) return;
        const dow = CATEGORY_DOW[cat.key];
        let late = false;
        if(dow){ const target = findWeekdayInRange(w.start,w.end,dow); late = today>target; }
        else { late = today>w.end; }
        if(late) atrasadosN++;
      });
    });
    if(atrasadosN>0) addAttn(attn, "CoreJoint_Reportes.html", `📦 ${atrasadosN} inventário(s)/marketing atrasado(s)`, "Toca para ver quais lojas e categorias", true);
    statAtrasados = atrasadosN;
  }catch(e){}

  try{
    const stock = await api("cj_fardamento_stock?select=quantidade&quantidade=lt.5");
    const dev = await api("cj_fardamento_devolucoes?select=id&recolhido=eq.false");
    setBadge("badge-fardamento", stock.length + dev.length);
    statFardamento = stock.length + dev.length;
    if(stock.length) addAttn(attn, "CoreJoint_Fardamento.html", `👕 ${stock.length} combinação(ões) de fardamento com stock baixo`, "Toca para ver quais peças e tamanhos", false);
    if(dev.length) addAttn(attn, "CoreJoint_Fardamento.html", `↩ ${dev.length} devolução(ões) por recolher`, "Toca para ver em que lojas", false);
  }catch(e){}

  try{
    const adendas = await api("cj_adendas?select=id,updated_at,criado_em&arquivada=eq.false");
    setBadge("badge-adendas", adendas.length);
    statAdendas = adendas.length;
    const paradas = adendas.filter(r=>{
      const ref = r.updated_at || r.criado_em;
      const dias = Math.floor((Date.now() - new Date(ref).getTime())/86400000);
      return dias>=3;
    });
    if(paradas.length) addAttn(attn, "CoreJoint_Adendas.html", `📋 ${paradas.length} adenda(s) parada(s) há 3+ dias`, "Toca para ver quais precisam de ação", true);
  }catch(e){}

  document.getElementById("statsGrid").innerHTML = `
    <div class="sc"><div class="slb">Reportes</div><div class="svl ${statReportes>0?'cr':'cg'}">${statReportes}</div></div>
    <div class="sc"><div class="slb">Atrasados</div><div class="svl ${statAtrasados>0?'cr':'cg'}">${statAtrasados}</div></div>
    <div class="sc"><div class="slb">Fardamento</div><div class="svl ${statFardamento>0?'cr':'cg'}">${statFardamento}</div></div>
    <div class="sc"><div class="slb">Adendas</div><div class="svl ${statAdendas>0?'cr':'cg'}">${statAdendas}</div></div>
  `;

  const section = document.getElementById("attnSection");
  if(attn.length===0){
    section.innerHTML = `<div class="all-clear">✔ Tudo em dia — nada precisa da tua atenção agora.</div>`;
    return;
  }
  section.innerHTML = `<div style="text-align:center; font-size:.8rem; color:var(--t2); margin-bottom:14px;">${attn.length} coisa${attn.length>1?'s':''} a precisar de atenção — toca numa app abaixo para ver.</div>`;
})();
</script>
</body>
</html>
